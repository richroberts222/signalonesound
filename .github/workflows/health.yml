name: Health

# Weekly dependency and tooling health. Reports problems; never blocks a merge.
# A failing step is a prompt to open an issue (docs/stack.md, docs/security.md).
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    name: Dependency and tooling health
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Known vulnerabilities in runtime dependencies (high and above)
        id: audit
        continue-on-error: true
        run: pnpm audit --prod --audit-level=high

      - name: Unmet peer dependencies
        id: peers
        continue-on-error: true
        run: pnpm peers check

      - name: Expo SDK compatibility
        id: expo
        continue-on-error: true
        working-directory: apps/mobile
        run: pnpm check:deps

      - name: Summary
        if: always()
        run: |
          {
            echo "## Weekly health"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Known vulnerabilities (runtime, high and above) | ${{ steps.audit.outcome }} |"
            echo "| Unmet peer dependencies | ${{ steps.peers.outcome }} |"
            echo "| Expo SDK compatibility | ${{ steps.expo.outcome }} |"
            echo ""
            echo "A failure is a prompt to open an issue. Known and recorded exceptions are listed in docs/stack.md and docs/secure-coding.md."
          } >> "$GITHUB_STEP_SUMMARY"
