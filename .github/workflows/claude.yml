name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@2dca132ff0e0c4094ce6048b422c6915a071210b # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Exact commands only: no wildcard on pnpm, npx, corepack or gh pr,
          # and no PR-merge command. Merging into main is human-only.
          claude_args: '--allowed-tools "Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(corepack enable),Bash(pnpm install --frozen-lockfile),Bash(pnpm lint),Bash(pnpm typecheck),Bash(pnpm test:run),Bash(pnpm test:boilerplate),Bash(pnpm build),Bash(pnpm validate),Bash(git fetch:*),Bash(git branch:*),Bash(git log:*),Bash(git show:*),Bash(git diff:*),Bash(git checkout:*),Bash(git cherry-pick:*),Bash(git add:*),Bash(git commit:*),Bash(git status:*),Bash(git merge:*),Bash(git merge-base:*)"'
