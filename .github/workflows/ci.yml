name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run validation
        run: pnpm validate

  template-proof:
    # Generates a brand-new application from this repository and runs that application's own
    # install, lint, typecheck, tests, build and first migration. Guard tests that only pass in
    # the reference application are caught here (docs/lessons.md). Informational until it has
    # been green for a week; then it can become a required check.
    name: Template proof
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prove a generated application passes its own checks
        run: pnpm prove:init --full

  fix-has-guard:
    # A pull request that is a fix must add or change a test, or log a lesson (docs/lessons.md).
    # Informational until it has been green for a week; then it can become a required check.
    name: Fix has a guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check that a fix carries a guard
        env:
          # Untrusted pull request text is passed through the environment, never interpolated into the script.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.head_ref }}
          BASE_REF: origin/${{ github.base_ref }}
        run: node scripts/fix-has-guard.mjs
