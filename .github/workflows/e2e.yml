name: E2E

# Browser tests (Playwright) for the web app, against the DEVELOPMENT database and the Clerk DEVELOPMENT
# instance only (docs/automation/playwright.md). Never production: the keys come from the E2E_* and dev
# secrets, and playwright.config.ts refuses anything but dev/qa databases and Clerk test keys. The report,
# screenshots and videos of any failure are kept as a run artifact. Traces are OFF in CI because a trace can
# contain a session token and this repository is public.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Pull requests from forks get no secrets, so the tests cannot run there; skip instead of failing.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the browser
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Build the app
        # The tests serve this production build (playwright.config.ts). Only the public Clerk key is needed to build
        # (it is written into the pages); no secret is given to this step.
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
        run: pnpm --filter web exec next build

      - name: Run the browser tests
        # The secrets are given to this one step only, not to installs or third-party actions.
        env:
          CI: "true"
          DATABASE_ENV: dev
          APP_ENV: dev
          DATABASE_URL: ${{ secrets.NEON_DEV_DATABASE_URL }}
          CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
          E2E_CLERK_USER_EMAIL: tester+clerk_test@example.com
          CONTACT_FORM_ENABLED: "on"
        # A memory reading is printed every 20 seconds, so if the runner is ever killed partway (as happened before this
        # setup), the log shows whether it ran out of memory. The reading is stopped when the tests end.
        run: |
          ( while true; do echo "[memory $(date +%T)] $(free -m | awk 'NR==2 {print "used " $3 " MB of " $2 " MB, free " $4 " MB"}')"; sleep 20; done ) &
          watcher=$!
          trap 'kill $watcher 2>/dev/null' EXIT
          pnpm --filter web exec playwright test

      - name: Remove the test messages
        if: always()
        # Only the tests' own messages (see apps/web/db/tooling/e2e-cleanup.ts); dev database only.
        env:
          DATABASE_ENV: dev
          APP_ENV: dev
          DATABASE_URL: ${{ secrets.NEON_DEV_DATABASE_URL }}
        run: pnpm --filter web db:cleanup:e2e --env=dev

      - name: Summarize the results
        if: always()
        run: node scripts/e2e-summary.mjs apps/web/playwright-report/results.json >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the report, screenshots and videos
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 14
          if-no-files-found: ignore
